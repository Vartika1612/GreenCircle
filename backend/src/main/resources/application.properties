# =============================================================================
# GreenCircle Backend — Application Properties
# All sensitive values are driven by environment variables.
# For local development without env vars, sensible H2 defaults are used.
# =============================================================================

spring.application.name=greencircle

# -----------------------------------------------------------------------------
# DataSource — defaults to H2 in-memory for local dev (zero setup required)
# Override DB_URL / DB_USER / DB_PASS for MySQL (prod or docker-compose)
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:greencircle;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.defer-datasource-initialization=true

# Seed data from schema.sql when using H2
spring.sql.init.mode=${SQL_INIT_MODE:embedded}

# -----------------------------------------------------------------------------
# JWT
# -----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:dev-secret-key-please-change-in-production-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------------------------------------------------------
# CORS
# -----------------------------------------------------------------------------
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}


# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=${PORT:8080}
